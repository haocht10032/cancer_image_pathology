<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc">
<title id="title">Three explanation pipelines and a common audit</title><desc id="desc">Predefined inputs and targets enter three separate trained models. Their attribution maps are tested on a shared grid using occlusion and ranked deletion, followed by uncertainty and stability analyses.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#81968d"/></marker></defs><rect width="360" height="850" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#192c2b">
<text x="10" y="22" fill="#087f75" font-size="11" font-weight="700">01 / FIX THE EVALUATION</text>
<rect x="10" y="35" width="340" height="74" rx="4" fill="#f3f7f5" stroke="#d7e1de"/>
<text x="24" y="59" font-size="16" font-weight="700">Predefined images and targets</text><text x="24" y="80" font-size="12">Source-aware splits; true-class and</text><text x="24" y="98" font-size="12">predicted-class analyses kept separate</text>
<text x="10" y="144" fill="#087f75" font-size="11" font-weight="700">02 / THREE SEPARATE PIPELINES</text>
<rect x="10" y="161" width="318" height="79" rx="4" fill="#fdf6f3" stroke="#e6cbc3"/><text x="24" y="185" font-size="18" fill="#ad463a" font-weight="700">ResNet18</text><text x="24" y="207" font-size="12">Fully fine-tuned classifier</text><text x="24" y="228" font-size="14" font-weight="700">Grad-CAM</text>
<rect x="10" y="252" width="318" height="79" rx="4" fill="#f2f7fc" stroke="#cbd9e8"/><text x="24" y="276" font-size="18" fill="#326cae" font-weight="700">DINOv2</text><text x="24" y="298" font-size="12">Frozen encoder + trained head</text><text x="24" y="319" font-size="14" font-weight="700">Gradient-weighted rollout</text>
<rect x="10" y="343" width="318" height="79" rx="4" fill="#f0f8f5" stroke="#bfdbd1"/><text x="24" y="367" font-size="18" fill="#087f75" font-weight="700">UNI</text><text x="24" y="389" font-size="12">Frozen encoder + trained head</text><text x="24" y="410" font-size="14" font-weight="700">Gradient-weighted rollout</text>
<g fill="none" stroke="#81968d" stroke-width="1.3"><path d="M328 200 H344 V444 H180 V477" marker-end="url(#arrow)"/><path d="M328 291 H344 M328 382 H344"/></g>
<text x="10" y="460" fill="#087f75" font-size="11" font-weight="700">03 / TEST THE EXPLANATIONS</text>
<rect x="10" y="487" width="340" height="63" rx="4" fill="#192c2b"/><text x="180" y="512" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">Common 14 x 14 image-space grid</text><text x="180" y="535" fill="#fff" font-size="12" text-anchor="middle">Fixed target / matched perturbation</text>
<path d="M180 550 V572" fill="none" stroke="#81968d" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="10" y="580" width="340" height="118" rx="4" fill="#f3f7f5" stroke="#d7e1de"/><text x="24" y="605" font-size="15" font-weight="700">Single-patch occlusion</text><text x="24" y="626" font-size="12">Attribution ranks vs. measured score changes</text><text x="24" y="658" font-size="15" font-weight="700">Top / random / bottom deletion</text><text x="24" y="679" font-size="12">Scale-free and probability endpoints</text>
<text x="10" y="735" fill="#087f75" font-size="11" font-weight="700">04 / QUANTIFY UNCERTAINTY</text><text x="10" y="760" font-size="16" font-weight="700">Paired inference + seed stability</text><text x="10" y="783" font-size="16" font-weight="700">Cross-dataset comparison</text><text x="10" y="810" font-size="12" fill="#576968">Kather: source-group inference.</text><text x="10" y="830" font-size="12" fill="#576968">CRC: exploratory tile inference; no patient IDs.</text>
</g></svg>
